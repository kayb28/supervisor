name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      # Firma estable: el mismo keystore en cada compilación para que
      # las actualizaciones se instalen encima de la versión anterior.
      # Sin secrets configurados, compila igual (firma de depuración).
      - name: Compilar (firma estable si hay secrets)
        env:
          SUPERVISOR_KEYSTORE_B64: ${{ secrets.SUPERVISOR_KEYSTORE }}
          SUPERVISOR_KEYSTORE_PASSWORD: ${{ secrets.SUPERVISOR_KEYSTORE_PASSWORD }}
          SUPERVISOR_KEY_ALIAS: ${{ secrets.SUPERVISOR_KEY_ALIAS }}
        run: |
          if [ -n "$SUPERVISOR_KEYSTORE_B64" ]; then
            echo "$SUPERVISOR_KEYSTORE_B64" | base64 -d > "$HOME/supervisor-release.jks"
            export SUPERVISOR_KEYSTORE="$HOME/supervisor-release.jks"
          fi
          gradle assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
